<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persistent Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Persistent Task Manager</h1>
    <p>Tasks are saved in this browser using localStorage.</p>
    <form id="task-form">
      <label class="sr-only" for="task-input">New task</label>
      <input id="task-input" type="text" placeholder="Enter a task..." maxlength="120" required>
      <button type="submit">Add task</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <ul id="task-list"></ul>
  </main>
  <script src="script.js"></script>
</body>
</html>
